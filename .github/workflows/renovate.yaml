name: Renovate

on:
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options:
        - trace
        - debug
        - info
        - warn
        - error
        - fatal
  schedule:
  - cron: "0 8 * * 1"

jobs:
  renovate:
    permissions: write-all

    name: Renovate dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Renovate
      uses: dagger/dagger-for-github@v8.4.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        version: "0.21.10"
        verb: call
        # Scheduled runs have no inputs, so fall back to info
        args: renovate --github-token=env://GITHUB_TOKEN --log-level=${{ inputs.log-level || 'info' }}
